  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }

  var lastSk=null;
  function renderBoard(){
    var t=tally(),st=streak();
    var beat=lastStreak!==null&&st>lastStreak?" beat":"";
    var skBeat=lastSk!==null&&t.stickers>lastSk?" beat":"";
    lastStreak=st; lastSk=t.stickers;
    $("board").innerHTML=
      '<div class="cell"><span class="v'+beat+'">'+st+'<u>일</u></span><span class="k">연속 달성</span></div>'+
      '<div class="cell"><span class="v">'+t.doneDays+'<u>일</u></span><span class="k">해낸 날</span></div>'+
      '<div class="cell"><span class="v'+skBeat+'">'+t.stickers.toLocaleString("ko-KR")+
        '<u>개</u></span><span class="k">칭찬 스티커</span></div>';
  }

  function todoList(d){
    var list=todosFor(d);
    if(!list.length) return '<div class="empty">추가한 학습이 없어요.</div>';
    return list.map(function(t,i){
      if(t.ghost){
        /* 지난 날에 남은 자국 — 회색, 체크할 수 없고, 배지를 누르면 옮긴 날로 간다 */
        var gd=isDone(t);
        return '<div class="todo ghost'+(gd?" gdone":"")+'"><button class="box" data-ghost="'+t.movedTo+'" aria-label="'+mmdd(t.movedTo)+'에서 체크할 수 있어요">'+opIcon(t,i)+'</button>'+
          '<span class="txt"><span class="tt">'+esc(t.text)+'</span>'+
            '<button class="carry mv" data-open="'+t.movedTo+'">이동 → '+mmdd(t.movedTo)+'</button></span>'+
          '<button class="del" data-del="'+t.id+'" aria-label="자국 지우기">'+icon("close")+'</button></div>';
      }
      var late=0;
      if(t.origDate&&!t.done) late=Math.round((parse(t.date)-parse(t.origDate))/86400000);
      var badge=late>0?'<span class="carry'+(late>=7?" long":"")+'">'+late+'일 이관</span>':"";
      if(t.skip&&!t.done) badge+='<button class="skipchip" data-unskip="'+t.id+'">건너뜀 · 되돌리기</button>';
      if(t.movedFrom&&t.movedFrom!==t.date) badge+='<span class="carry mv">이동 ← '+mmdd(t.movedFrom)+'</span>';
      var key="t:"+t.id;
      /* 학습량은 글자로만 보여 준다 — 눌러도 이름과 똑같이 고치기가 열린다 */
      var cnt=t.count
        ? '<button class="t-count'+(editor&&editor.id===t.id?" open":"")+'" data-edit="'+t.id+'">'+
            esc(String(t.count))+'<u>'+esc(t.unit||"페이지")+'</u></button>'
        : '';
      /* 기호는 목록 차례대로 + − × ÷ 가 돌아간다 — 앱 아이콘과 같은 순서 */
      var sj=subjOf(t.subj);
      var boxStyle=(sj&&!t.done&&!t.skip)?' style="color:'+sj.color+'"':'';
      var row='<div class="todo'+(t.done?" on":"")+(t.skip&&!t.done?" skipped":"")+'">'+
        '<button class="box" data-todo="'+t.id+'"'+boxStyle+' aria-label="완료 표시">'+
          opIcon(t,i)+'</button>'+
        '<button class="txt" data-edit="'+t.id+'" aria-label="학습 고치기">'+
          subjTag(t)+'<span class="tt">'+esc(t.text)+'</span>'+byTag(t.by)+badge+'</button>'+
        (t.done?'<span class="tst">'+sticker("smile",pop===key)+'</span>':'')+
        cnt+
        '<button class="addkid" data-addkid="'+t.id+'" aria-label="추가 학습·코멘트 달기">'+icon("plus")+'</button>'+
        '<button class="del" data-del="'+t.id+'" aria-label="삭제">'+icon("close")+'</button>'+
        '</div>';
      if(delAsk===t.id){
        row+='<div class="askrow">반복으로 만든 학습이에요.'+
          '<button class="chip" data-delone="'+t.id+'">이 날짜만</button>'+
          '<button class="chip" data-delall="'+t.id+'">전체 반복</button>'+
          '<button class="chip plain" data-delno>취소</button></div>';
      }
      if(editor&&editor.id===t.id) row+=editArea(t,i,list.length);
      return row+kidsHtml(t);
    }).join("");
  }


  /* ---------- 한 줄 고치기 폼 ---------- */
  var editor=null;   /* {id, text, count, unit, err} */
  var delAsk=null;   /* 지울 범위를 묻고 있는 학습 */

  function openEditor(t){
    editor={id:t.id,text:t.text,count:t.count!=null?String(t.count):"",
            unit:t.unit||"페이지",subj:t.subj||null,track:t.track||null,
            mode:"one",from:t.date,to:clampDate(shift(t.date,27)),
            dows:[0,1,2,3,4,5,6],err:""};
  }
  /* 과목과 과정을 고르는 칩. 과정이 있는 과목(수학)만 아랫줄이 나온다. */
  function subjChips(c,sa,ta){
    var list=subjects();
    var chips=list.map(function(g){
      var on=(c.subj===g.id);
      return '<button class="chip subjchip'+(on?" on":"")+'" '+sa+'="'+g.id+'"'+
        (on?' style="background:'+g.color+';border-color:'+g.color+';color:#fff"':
            ' style="border-color:'+g.color+';color:'+g.color+'"')+'>'+esc(g.name)+'</button>';
    }).join("");
    var out='<div class="fld"><span class="lb">과목</span><div class="chips">'+chips+'</div>';
    var sj=subjOf(c.subj), ts=sj?(sj.tracks||[]):[];
    if(ts.length){
      var tr=ts.map(function(x){
        var on=(c.track===x.id);
        return '<button class="chip sym'+(on?" on":"")+'" '+ta+'="'+x.id+'">'+
          symIcon(x.sym,"symic")+esc(x.name)+'</button>';
      }).join("");
      out+='<div class="chips sub">'+tr+'</div>';
    }
    return out+'</div>';
  }
  /* 학습량 칸 — 페이지류는 56-60 같은 범위도 받으니 글자칸으로 연다 */
  function amountInput(c,attr){
    var page=kindOf(c.unit).id==="page";
    /* 안내 글씨는 고른 단위를 그대로 쓴다 — '페이지 입력', '분 입력' */
    var ph=(c.unit||"페이지")+" 입력";
    return '<input type="'+(page?"text":"number")+'" '+attr+'="count" '+
      'value="'+esc(String(c.count))+'" placeholder="'+esc(ph)+'" '+
      (page?'inputmode="text" maxlength="24" '+
            'autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"'
          :'inputmode="numeric" min="1" max="999"')+'>';
  }

  function unitChips(c,ka,ua){
    var kind=kindOf(c.unit);
    var kinds=UNIT_KINDS.map(function(g){
      return '<button class="chip'+(g.id===kind.id?" on":"")+'" '+ka+'="'+g.id+'">'+g.name+'</button>';
    }).join("");
    var units=kind.units.map(function(u){
      return '<button class="chip'+(c.unit===u?" on":"")+'" '+ua+'="'+u+'">'+u+'</button>';
    }).join("");
    return '<div class="chips">'+kinds+'</div><div class="chips sub">'+units+'</div>';
  }

  function editArea(t,i,n){
    var c=editor;
    return '<div class="composer edit">'+
      '<div class="fld"><span class="lb">학습</span>'+
        '<input type="text" data-e="text" value="'+esc(c.text)+'" maxlength="60" '+INPUT_ATTRS+'></div>'+
      '<div class="row2">'+
        '<div class="fld num"><span class="lb">학습량</span>'+
          amountInput(c,"data-e")+'</div>'+
        '<div class="fld unit"><span class="lb">단위</span>'+unitChips(c,"data-ekind","data-eunit")+'</div>'+
      '</div>'+
      subjChips(c,"data-esubj","data-etrack")+
      '<div class="fld"><span class="lb">반복</span><div class="chips">'+
        '<button class="chip'+(c.mode==="one"?" on":"")+'" data-emode="one">이 날짜만</button>'+
        '<button class="chip'+(c.mode==="range"?" on":"")+'" data-emode="range">기간 반복</button>'+
      '</div></div>'+
      (c.mode==="range"?
        '<div class="fld"><span class="lb">기간</span><div class="dates">'+
          '<input type="date" data-e="from" value="'+c.from+'" min="'+START+'" max="'+END+'" aria-label="시작일">'+
          '<span class="tilde">~</span>'+
          '<input type="date" data-e="to" value="'+c.to+'" min="'+START+'" max="'+END+'" aria-label="종료일">'+
        '</div></div>'+
        '<div class="fld"><span class="lb">이 요일마다</span><div class="chips dows">'+
          DOW.map(function(name,k){
            return '<button class="chip'+(k===0?" sun":"")+(c.dows.indexOf(k)>=0?" on":"")+
              '" data-edow="'+k+'">'+name+'</button>';
          }).join("")+'</div></div>'+
        '<div class="chint">'+previewCount(c)+' 이 날짜는 빼고 만들어요.</div>'
        :'')+
      '<div class="fld"><span class="lb">순서</span><div class="chips">'+
        '<button class="chip" data-ord="-1"'+(i===0?" disabled":"")+'>'+icon("mvup")+'위로</button>'+
        '<button class="chip" data-ord="1"'+(i===n-1?" disabled":"")+'>'+icon("mvdown")+'아래로</button>'+
      '</div></div>'+
      '<div class="fld"><span class="lb">다른 날로 옮기기 (계획이 바뀌었을 때)</span><div class="dates">'+
        '<input type="date" id="mvDate" value="'+(t.date<CUR?CUR:t.date)+'" min="'+CUR+'" max="'+END+'" aria-label="옮길 날짜">'+
        '<button class="btn" data-move-one="'+t.id+'" style="flex:none">옮기기</button></div></div>'+
      (t.by?'<div class="chint">처음 작성 '+byTag(t.by)+'</div>':'')+
      (c.err?'<div class="cerr">'+esc(c.err)+'</div>':'')+
      '<div class="cacts">'+
        '<button class="btn primary" data-edit-save>저장</button>'+
        '<button class="btn" data-edit-cancel>취소</button>'+
      '</div></div>';
  }

  /* ---------- 할 일 만들기 폼 ---------- */
  var composer=null;   /* {date, where, text, count, unit, mode, from, to, dows, err} */
  /* 단위는 두 단으로 고른다 — 먼저 무엇을 세는지(페이지·시간), 그다음 낱개 단위 */
  var UNIT_KINDS=[
    {id:"page",name:"페이지",units:["페이지","장","권"]},
    {id:"time",name:"시간",units:["분","시간"]}
  ];
  function kindOf(u){
    for(var i=0;i<UNIT_KINDS.length;i++){
      if(UNIT_KINDS[i].units.indexOf(u)>=0) return UNIT_KINDS[i];
    }
    return UNIT_KINDS[0];
  }

  function openComposer(d,where){
    composer={
      date:d, where:where, text:"", count:"", unit:"페이지",
      subj:(subjects()[0]||{}).id, track:null,
      mode:"one", from:d, to:clampDate(shift(d,27)),
      dows:[0,1,2,3,4,5,6], err:""
    };
  }
  function clampDate(d){return d<START?START:(d>END?END:d);}

  function addArea(d,where){
    var open=composer&&composer.date===d&&composer.where===where;
    if(!open){
      return '<button class="addbtn" data-open-compose="'+d+'" data-where="'+where+'">'+
        icon("plus")+'학습 추가</button>';
    }
    var c=composer;
    var modes='<button class="chip'+(c.mode==="one"?" on":"")+'" data-mode="one">하루만</button>'+
              '<button class="chip'+(c.mode==="range"?" on":"")+'" data-mode="range">기간 반복</button>';

    var period="";
    if(c.mode==="range"){
      var dows=DOW.map(function(name,i){
        return '<button class="chip'+(i===0?" sun":"")+(c.dows.indexOf(i)>=0?" on":"")+
          '" data-dow="'+i+'">'+name+'</button>';
      }).join("");
      period=
        '<div class="fld"><span class="lb">기간</span><div class="dates">'+
          '<input type="date" data-c="from" value="'+c.from+'" min="'+START+'" max="'+END+'" aria-label="시작일">'+
          '<span class="tilde">~</span>'+
          '<input type="date" data-c="to" value="'+c.to+'" min="'+START+'" max="'+END+'" aria-label="종료일">'+
        '</div></div>'+
        '<div class="fld"><span class="lb">이 요일마다</span>'+
          '<div class="chips dows">'+dows+'</div></div>'+
        '<div class="chint">'+previewCount(c)+'</div>';
    }

    var sugg=suggOf(c.subj).filter(function(x){return x!==c.text;});
    var suggRow=sugg.length
      ? '<div class="chips sugg">'+sugg.map(function(x){
          return '<button class="chip" data-sugg="'+esc(x)+'">'+esc(x)+'</button>';
        }).join("")+'</div>'
      : '';
    return '<div class="composer">'+
      '<div class="fld"><span class="lb">학습</span>'+
        '<input type="text" data-c="text" value="'+esc(c.text)+'" maxlength="60" '+
        'placeholder="예: 기적의 계산법" '+INPUT_ATTRS+'>'+suggRow+'</div>'+
      '<div class="row2">'+
        '<div class="fld num"><span class="lb">학습량</span>'+
          amountInput(c,"data-c")+'</div>'+
        '<div class="fld unit"><span class="lb">단위</span>'+
          unitChips(c,"data-kind","data-unit")+'</div>'+
      '</div>'+
      subjChips(c,"data-subj","data-track")+
      '<div class="fld"><span class="lb">언제</span><div class="chips">'+modes+'</div></div>'+
      period+
      (c.err?'<div class="cerr">'+esc(c.err)+'</div>':'')+
      '<div class="cacts">'+
        '<button class="btn" data-compose-cancel>취소</button>'+
        '<button class="btn primary" data-compose-save>만들기</button>'+
      '</div></div>';
  }

  /* 기간·요일을 고르면 몇 개가 만들어지는지 미리 알려준다 */
  function previewCount(c){
    var from=c.from,to=c.to;
    if(!from||!to) return "";
    if(from>to){var sw=from;from=to;to=sw;}
    from=clampDate(from); to=clampDate(to);
    if(!c.dows.length) return "요일을 하나 이상 골라 주세요.";
    var n=0,d=from,guard=0;
    while(d<=to&&guard++<400){
      if(c.dows.indexOf(parse(d).getDay())>=0) n++;
      d=shift(d,1);
    }
    return n?("학습 "+n+"개가 만들어져요."):"그 기간에는 고른 요일이 없어요.";
  }

  /* 하위 항목 — ㄴ 추가 학습(체크 칸) · ㄴ 코멘트(말풍선) */
  var kidForm=null;   /* {pid, kind, text, err} */
  var kidEdit=null;   /* {id, text, err} */
  function kidEditArea(k){
    var task=k.kind!=="note";
    return '<div class="kidform">'+
      '<input type="text" id="kidEd" data-ke="text" value="'+esc(kidEdit.text)+'" maxlength="80" '+INPUT_ATTRS+'>'+
      (task?'<div class="dates"><span class="kf-me" style="flex:none">다른 날로 옮기기</span>'+
        '<input type="date" id="kidMv" value="'+(k.date<CUR?CUR:k.date)+'" min="'+CUR+'" max="'+END+'" aria-label="옮길 날짜">'+
        '<button class="btn" data-kmove="'+k.id+'" style="flex:none">옮기기</button></div>'+
        '<div class="chint">옮기면 그날의 메인 학습이 돼요.</div>':'')+
      (kidEdit.err?'<div class="cerr">'+esc(kidEdit.err)+'</div>':'')+
      '<div class="kf-foot"><span class="kf-me">'+(k.by?'작성 '+byTag(k.by):'')+'</span>'+
      '<button class="btn primary" data-kedit-save>저장</button><button class="btn" data-kedit-cancel>취소</button>'+
      '<button class="btn warn" data-kdel="'+k.id+'">삭제</button></div></div>';
  }
  function kidsHtml(t){
    var html=kidsOf(t.id).map(function(k){
      if(kidEdit&&kidEdit.id===k.id) return kidEditArea(k);
      if(k.ghost){
        var kgd=isDone(k);
        return '<div class="kid ghost'+(kgd?" gdone":"")+'"><span class="kid-l">ㄴ</span><button class="kbox" data-ghost="'+k.movedTo+'" aria-label="'+mmdd(k.movedTo)+'에서 체크할 수 있어요">'+(kgd?icon("check"):'')+'</button>'+
          '<span class="kt">'+esc(k.text)+'</span>'+
          '<button class="carry mv" data-open="'+k.movedTo+'">이동 → '+mmdd(k.movedTo)+'</button>'+
          '<button class="del" data-del="'+k.id+'" aria-label="자국 지우기">'+icon("close")+'</button></div>';
      }
      if(k.kind==="note"){
        return '<div class="kid note"><span class="kid-l">ㄴ</span><span class="kic">'+icon("chat")+'</span>'+
          '<button class="kt" data-kedit="'+k.id+'">'+esc(k.text)+byTag(k.by)+'</button>'+
          '<button class="del" data-del="'+k.id+'" aria-label="코멘트 삭제">'+icon("close")+'</button></div>';
      }
      return '<div class="kid'+(k.done?" on":"")+'"><span class="kid-l">ㄴ</span>'+
        '<button class="kbox" data-todo="'+k.id+'" aria-label="'+(k.done?"완료 취소":"완료 표시")+'">'+(k.done?icon("check"):"")+'</button>'+
        '<button class="kt" data-kedit="'+k.id+'"><span class="hl">'+esc(k.text)+'</span>'+byTag(k.by)+'</button>'+
        '<button class="del" data-del="'+k.id+'" aria-label="추가 학습 삭제">'+icon("close")+'</button></div>';
    }).join("");
    if(kidForm&&kidForm.pid===t.id){
      var me=roleOf(getMe());
      html+='<div class="kidform">'+
        '<div class="chips"><button class="chip'+(kidForm.kind==="task"?" on":"")+'" data-kkind="task">ㄴ 추가 학습</button>'+
        '<button class="chip'+(kidForm.kind==="note"?" on":"")+'" data-kkind="note">ㄴ 코멘트</button></div>'+
        '<input type="text" id="kidIn" data-k="text" value="'+esc(kidForm.text)+'" maxlength="80" placeholder="'+
          (kidForm.kind==="note"?"예: 끝까지 집중해서 풀었어!":"예: 오답노트 쓰기")+'" '+INPUT_ATTRS+'>'+
        (kidForm.err?'<div class="cerr">'+esc(kidForm.err)+'</div>':'')+
        '<div class="kf-foot"><span class="kf-me">'+(me?'작성 '+byTag(me.id):'설정 → 내 역할을 고르면 누가 썼는지 남아요')+'</span>'+
        '<button class="btn primary" data-kid-save>추가</button><button class="btn" data-kid-cancel>취소</button></div></div>';
    }
    return html;
  }

  /* 학습 목록 보기 — 하루(기본: 오늘) · 이번 주 · 이번 달 · 기간 */
  var listMode="day", listFrom=null, listTo=null;
  function weekStart(d){var p=parse(d);return shift(d,-((p.getDay()+6)%7));}
  function modeRange(){
    if(listMode==="week"){var a=weekStart(CUR);return [a,shift(a,6)];}
    if(listMode==="month"){var p=parse(CUR);return [CUR.slice(0,8)+"01",fmt(new Date(p.getFullYear(),p.getMonth()+1,0))];}
    if(listMode==="range"){var f=listFrom||weekStart(CUR),t=listTo||shift(f,6); if(f>t){var x=f;f=t;t=x;} return [f,t];}
    return [SEL,SEL];
  }
  function modeTabs(){
    var tabs=[["day","오늘"],["week","이번 주"],["month","이번 달"],["range","기간"]];
    return '<div class="lmode">'+tabs.map(function(t){
      var on=t[0]===listMode&&(t[0]!=="day"||SEL===CUR);
      return '<button data-lmode="'+t[0]+'" class="'+(on?"on":"")+'">'+t[1]+'</button>';
    }).join("")+'</div>';
  }
  function renderList(){
    var r=modeRange(),from=r[0],to=r[1],total=0,done=0,html="",d=from,g=0;
    var names={week:"이번 주의 학습",month:"이번 달의 학습",range:"기간 학습"};
    var head='<div class="today-head"><div><div class="eyebrow">'+names[listMode]+'</div>'+
      '<div class="today-date">'+label(from)+' ~ '+label(to)+'</div></div></div>'+modeTabs();
    if(listMode==="range"){
      head+='<div class="lrange"><input type="date" id="lrFrom" data-lr="from" value="'+from+'" min="'+START+'" max="'+END+'" aria-label="시작일">'+
        '<span>~</span><input type="date" id="lrTo" data-lr="to" value="'+to+'" min="'+START+'" max="'+END+'" aria-label="종료일"></div>';
    }
    while(d<=to&&g++<400){
      if(todosFor(d).length){
        var st=dayStat(d); total+=st.total; done+=st.done;
        html+='<div class="lday"><button class="lday-h" data-open="'+d+'"><span>'+label(d)+' '+dowOf(d)+'요일'+(d===CUR?' <em>오늘</em>':'')+'</span>'+
          '<span class="lday-n">'+(st.complete?'다 했어요':st.done+' / '+st.total)+'</span></button>'+todoList(d)+'</div>';
      }
      d=shift(d,1);
    }
    if(total) head+='<div class="lsum">해낸 학습 '+done+' / '+total+'</div>';
    $("dayPanel").innerHTML=head+'<div class="todos">'+(html||'<div class="empty">이 기간에는 계획한 학습이 없어요.</div>')+'</div>';
  }
  function renderDay(){
    if(listMode!=="day"){renderList();return;}
    var d=SEL,complete=isComplete(d);
    /* '오늘의 학습' 옆에 또 '오늘'을 붙이면 같은 말이 두 번이다 —
       오늘이 아닌 날에만 지난/앞으로를 표시한다. */
    var when=d===CUR?"":(d<CUR?"지난 날":"앞으로");
    var badge=complete
      ? '<div class="badge'+(pop==="day:"+d?" pop":"")+'">'+sticker(daySticker(d))+'완료!</div>'
      : '';
    var html='<div class="today-head"><div>'+
      '<div class="eyebrow">오늘의 학습'+
        (when?'<span class="when">'+when+'</span>':"")+'</div>'+
      '<div class="today-date">'+label(d)+' '+dowOf(d)+'요일</div>'+dayTags(d)+'</div>'+badge+'</div>'+modeTabs();
    html+='<div class="todos">'+todoList(d)+addArea(d,"today")+'</div>';
    if(complete){
      html+='<div class="cheer">'+sticker("crown")+'<span>'+dayCheer(d)+'</span></div>';
    }else if(d<CUR){
      /* 손으로 그 날에 적어 둔 학습은 그대로 머문다 —
         오늘로 옮겨지는 것이 있을 때만 그렇게 안내한다 */
      var willMove=todosFor(d).some(function(t){
        return !t.done&&!t.series&&!t.back;
      });
      html+='<div class="note">'+
        (willMove?'지난 날의 못 한 학습은 다음에 열 때 오늘로 옮겨져요. ':'')+
        '여기서 바로 체크해도 그날 스티커가 붙어요.</div>';
    }
    $("dayPanel").innerHTML=html;
  }

  /* 달력에서 날짜를 고른다 — 다른 달의 날이면 달력도 그 달로 넘긴다 */
  function selectDay(d,scroll){
    if(!inRange(d)) return;
    SEL=d;
    composer=null;
    editor=null;
    delAsk=null;
    kidForm=null; kidEdit=null; listMode="day";
    var p=parse(d);
    view.y=p.getFullYear(); view.m=p.getMonth();
    renderAll();
    if(scroll){
      /* 이미 그 날을 보고 있어도 눌린 것이 보이도록 패널을 한 번 깜빡인다 */
      var panel=$("dayPanel");
      try{panel.scrollIntoView({block:"start",behavior:"smooth"});}catch(e){}
      panel.classList.remove("flash");
      void panel.offsetWidth;          /* 애니메이션을 다시 태우기 위한 한 박자 */
      panel.classList.add("flash");
      setTimeout(function(){panel.classList.remove("flash");},1000);
    }
  }

  var mover=null;   /* {id:옮길 학습, to:옮길 날, err:""} */

  function renderBacklog(){
    var missed=missedDays(),wrap=$("backlogWrap");
    if(!missed.length){wrap.innerHTML="";mover=null;return;}
    /* 옮기던 학습이 목록에서 빠졌으면 날짜칸도 닫는다 */
    if(mover&&!findTodo(mover.id)) mover=null;

    var show=missed.slice(-5).reverse();
    var left=0;
    missed.forEach(function(d){left+=pendingOf(d).length;});

    var rows=show.map(function(d){
      var items=pendingOf(d).map(function(t){
        var sj=subjOf(t.subj);
        var amount=t.count?'<span class="bc">'+esc(String(t.count))+esc(t.unit||"페이지")+'</span>':'';
        var one='<div class="bi">'+
          '<button class="box" data-blchk="'+t.id+'"'+(sj?' style="color:'+sj.color+'"':'')+
            ' aria-label="해냈어요">'+opIcon(t,0)+'</button>'+
          '<span class="bt">'+subjTag(t)+esc(t.text)+amount+'</span>'+
          '<button class="go'+(mover&&mover.id===t.id?" on":"")+'" data-blmv="'+t.id+'">옮기기</button>'+
          '<button class="go" data-blskip="'+t.id+'">건너뛰기</button>'+

      }).join("");
      return '<div class="blday"><div class="bl">'+

      '건너뛰기는 못 한 채로 두고 이 목록에서만 뺍니다.</p>'+

      (missed.length>show.length?'<div class="bl-more">그 밖에 '+(missed.length-show.length)+'일 더 — 달력에서 확인</div>':"")+

  var view={y:parse(CUR).getFullYear(),m:parse(CUR).getMonth()};

  function renderCal(){
    $("calTitle").textContent=view.y+"년 "+(view.m+1)+"월";
    var first=new Date(view.y,view.m,1);
    var dim=new Date(view.y,view.m+1,0).getDate();
    var cells="";
    for(var i=0;i<first.getDay();i++) cells+='<div class="day pad"></div>';
    for(var day=1;day<=dim;day++){
      var key=fmt(new Date(view.y,view.m,day));
      var cls="day"+(new Date(view.y,view.m,day).getDay()===0?" sun":"");
      var hol=holidayOf(key),evs=eventsOn(key);
      if(hol) cls+=" holi";
      if(!inRange(key)){
        cells+='<div class="'+cls+' out"><span class="n">'+day+'</span><span class="mk"></span></div>';
        continue;
      }
      var st=dayStat(key);
      if(st.complete) cls+=" full";
      else if(st.done>0) cls+=" part";
      else if(key<CUR) cls+=" missed";
      if(key===CUR) cls+=" today";
      if(key===SEL) cls+=" sel";
      /* 다 해낸 날엔 스티커, 하는 중인 날엔 얼마나 했는지 눈금이 붙는다.
         학습 수가 날마다 다르므로 개수 대신 비율로 그린다. */
      /* 표시 자리는 늘 같은 높이로 비워 둔다 — 스티커가 붙어도 날짜가 밀려 올라가지 않는다 */
      var mark="";
      if(st.complete) mark='<span class="dst">'+sticker(daySticker(key),pop==="day:"+key)+'</span>';
      else if(st.total>0) mark='<span class="prog"><i style="width:'+
        Math.round(st.done/st.total*100)+'%"></i></span>';
      var evb="";
      if(evs.length){
        /* 개인 일정 — 칸 맨 위 얇은 띠. 기간 일정은 칸 끝까지 이어진다 */
        evb='<span class="evbar">'+evs.slice(0,2).map(function(x){
          var cont=x.kind==="range",l=cont&&x.date<key,r=cont&&key<(x.end||x.date);
          return '<i class="'+(cont?"rg":"pt")+(l?" l":"")+(r?" r":"")+'" style="background:'+x.color+'"></i>';
        }).join("")+'</span>';
      }
      var tip=[hol].concat(evs.map(function(x){return x.name;})).filter(Boolean).join(", ");
      cells+='<button class="'+cls+'" data-open="'+key+'"'+
        (key===SEL?' aria-current="date"':"")+(tip?' title="'+esc(tip)+'"':'')+'>'+evb+
        '<span class="n">'+day+'</span><span class="mk">'+mark+'</span></button>';
    }
    /* 마지막 주의 남은 칸도 앞쪽 빈칸과 같은 모양으로 채운다 */
    var used=first.getDay()+dim;
    for(var k=used%7?7-used%7:0;k>0;k--) cells+='<div class="day pad"></div>';
    $("grid").innerHTML=cells;
    $("prev").disabled=fmt(new Date(view.y,view.m,1))<=START;
    $("next").disabled=fmt(new Date(view.y,view.m,dim))>=END;
    $("today").disabled=SEL===CUR&&view.y===parse(CUR).getFullYear()&&view.m===parse(CUR).getMonth();
  }

  /* ---------- 365일 여정 ----------
     이 앱의 목표는 '365일 하루도 빠짐없이'다. 그 목표를 얼마나 채웠는지,
     다음 이정표까지 며칠 남았는지를 한 자리에서 보여 준다. */
  var JOURNEY=[
    {at:0,   name:"시작",       say:"오늘부터 하루씩 채워요",  sym:"dot"},
    {at:7,   name:"일주일",     say:"이레를 채웠어요",         sym:"plus"},
    {at:30,  name:"한 달",      say:"한 달을 채웠어요",        sym:"equal"},
    {at:60,  name:"두 달",      say:"두 달째 이어 가요",       sym:"circle"},
    {at:100, name:"백 일",      say:"백 일을 넘었어요",        sym:"shape"},
    {at:180, name:"반년",       say:"절반을 지났어요",         sym:"rule"},
    {at:270, name:"아홉 달",    say:"마지막 계절이에요",       sym:"times"},
    {at:365, name:"일 년 완주", say:"365일을 다 채웠어요!",    sym:"star"}
  ];
  function stageOf(n){
    var i=0;
    for(var k=0;k<JOURNEY.length;k++) if(n>=JOURNEY[k].at) i=k;
    return {idx:i,cur:JOURNEY[i],next:JOURNEY[i+1]||null};
  }
  function renderStage(){
    var wrap=$("stageWrap");
    if(!wrap) return;
    var t=tally(),n=t.doneDays,st=stageOf(n);
    var pct=Math.max(n?2:0,Math.min(100,Math.round(n/TOTAL*100)));
    var dots=JOURNEY.map(function(x,k){
      return '<span class="sdot'+(k<=st.idx?" on":"")+'" title="'+esc(x.name)+'"></span>';
    }).join("");
    wrap.innerHTML='<div class="stage">'+
      '<div class="s-top">'+
        '<span class="s-ic">'+symIcon(st.cur.sym)+'</span>'+

          '<div class="s-name">'+esc(st.cur.name)+' · '+esc(st.cur.say)+'</div>'+
          '<div class="s-goal">목표 365일 가운데 '+n+'일을 해냈어요 · '+pct+'%</div>'+
        '</div>'+
        '<span class="s-n">'+n+'<u>/'+TOTAL+'</u></span>'+

    '</div>';
  }

  /* ---------- 과목별 성장 ----------
     고른 기간 안에서 과목마다 몇 개를 해냈는지, 시간은 얼마인지 모은다. */
  var growRange="week";
  function growFrom(){
    if(growRange==="month") return CUR.slice(0,8)+"01";
    if(growRange==="all") return START;
    /* 달력이 일요일로 한 주를 시작하므로 여기서도 일요일부터 센다 */
    return shift(CUR,-parse(CUR).getDay());
  }
  function growthStats(){
    var from=growFrom(),out=[],by={};
    subjects().forEach(function(g){
      by[g.id]={id:g.id,name:g.name,short:g.short||g.name.charAt(0),
        color:g.color,icon:g.icon,done:0,total:0,min:0};
      out.push(by[g.id]);
    });
    /* 과목을 고르기 전에 적어 둔 학습도 빠뜨리지 않는다 */
    var etc={id:"__etc",name:"기타",short:"기",color:"#8a8a8a",done:0,total:0,min:0};
    out.push(etc);
    state.todos.forEach(function(t){
      if(t.del||t.ghost||t.kind==="note") return;
      if(t.date<from||t.date>CUR) return;
      var box=by[t.subj]||etc;
      box.total++;
      if(t.done){
        box.done++;
        if(t.unit==="분") box.min+=(parseInt(t.count,10)||0);
        else if(t.unit==="시간") box.min+=(parseInt(t.count,10)||0)*60;
      }
    });
    return out.filter(function(x){return x.total>0;});
  }
  function fmtMin(m){
    if(!m) return "";
    if(m<60) return m+"분";
    var h=Math.floor(m/60),r=m%60;
    return h+"시간"+(r?" "+r+"분":"");
  }
  function renderGrowth(){
    var wrap=$("growWrap");
    if(!wrap) return;
    var list=growthStats();
    /* 고른 기간이 비었다고 칸을 통째로 감추면 기간을 바꿀 수가 없다 —
       기록이 하나라도 있으면 칸은 남겨 두고 안내만 바꾼다. */
    var any=false;
    state.todos.forEach(function(t){if(!t.del&&!t.ghost&&t.kind!=="note") any=true;});
    if(!any){wrap.innerHTML="";return;}
    var max=1;
    list.forEach(function(x){if(x.total>max) max=x.total;});
    var tabs=[["week","이번 주"],["month","이번 달"],["all","전체"]].map(function(t){
      return '<button class="chip'+(growRange===t[0]?" on":"")+'" data-grow="'+t[0]+'">'+t[1]+'</button>';
    }).join("");
    var lab={week:"이번 주",month:"이번 달",all:"전체"}[growRange];
    var sumDone=0;
    list.forEach(function(x){sumDone+=x.done;});
    var rows=!list.length
      ? '<div class="chint">이 기간에는 아직 기록이 없어요.</div>'
      : list.map(function(x){
      var pct=Math.round(x.done/x.total*100);
      return '<div class="gr">'+
        '<span class="by subj" style="background:'+x.color+'">'+esc(x.short)+'</span>'+
        '<span class="gname">'+esc(x.name)+'</span>'+
        '<span class="gbar" style="width:'+Math.round(x.total/max*100)+'%">'+
          '<i style="width:'+pct+'%;background:'+x.color+'"></i></span>'+
        '<span class="gnum">'+x.done+'<u>/'+x.total+'</u>'+
          (x.min?' · '+fmtMin(x.min):'')+'</span>'+
      '</div>';
    }).join("");
    wrap.innerHTML='<div class="growth">'+
      secHead("grow","과목별 성장",lab+" "+sumDone+"개",false)+
      '<div class="sec-body"'+(secOpen.grow?"":" hidden")+'>'+
        '<div class="g-head"><div class="chips">'+tabs+'</div></div>'+rows+
      '</div></div>';
  }

      window.navigator.standalone===true;

  /* 알림 한 줄 */

  /* 브라우저가 저장 공간을 함부로 비우지 못하게 요청 */
  var persisted=null;
  function checkPersist(){
    if(!navigator.storage||!navigator.storage.persisted) return;
    navigator.storage.persisted().then(function(p){
      persisted=p;
      if(booted) renderKeep();
    }).catch(function(){});
  }
  var askedPersist=false;
  function askPersist(){
    if(askedPersist||!navigator.storage||!navigator.storage.persist) return;

  function whenLabel(iso){
    if(!iso) return null;
    var d=new Date(iso);
    if(isNaN(d)) return null;
    var days=Math.floor((parse(fmt(new Date()))-parse(fmt(d)))/86400000);
    var t=(d.getMonth()+1)+"월 "+d.getDate()+"일";
    if(days===0) return "오늘 "+d.getHours()+":"+(d.getMinutes()<10?"0":"")+d.getMinutes();
    if(days===1) return "어제";
    return t+" ("+days+"일 전)";
  }

  /* --- 백업 파일 내보내기 ---
     두 앱은 같은 주소(아이디.github.io)를 쓰므로 저장 공간을 공유한다.
     그래서 백업 한 파일에 '도아 셈'과 '도아 킥' 기록을 함께 담는다.
     어느 앱에서 내보내도, 어느 앱에서 불러와도 둘 다 복구된다. */
  function exportData(){
    var apps={};
    apps[KEY]={done:state.done,todos:state.todos,me:state.me||null,seed:true};
    try{
      var raw=localStorage.getItem(OTHER_KEY);
      if(raw){
        var o=JSON.parse(raw);
        if(o&&o.done) apps[OTHER_KEY]={done:o.done,todos:o.todos||[],seed:true};
      }
    }catch(e){}

    var payload={
      app:"doa-apps", v:3,
      exportedAt:new Date().toISOString(),
      from:"도아 셈",
      apps:apps
    };
    var text=JSON.stringify(payload,null,2);
    var name="도아기록-백업-"+fmt(new Date())+".json";
    state.backupAt=new Date().toISOString();
    save();

    /* iOS 는 다운로드보다 공유 시트가 확실하다 — 파일 공유를 먼저 시도 */
    try{
      if(window.File&&navigator.canShare){
        var file=new File([text],name,{type:"application/json"});
        if(navigator.canShare({files:[file]})){
          navigator.share({files:[file],title:name})
            .then(function(){toast("두 앱 기록을 한 파일로 저장했어요.");})
            .catch(function(){});
          return;
        }
      }
    }catch(e){}

    var blob=new Blob([text],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=name; a.rel="noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},2000);
    toast("두 앱 기록을 한 파일로 저장했어요.");
  }

  /* --- 백업 파일 불러오기 (합치기 — 기존 기록을 지우지 않는다) --- */
  function importData(text){
    var raw;
    try{raw=JSON.parse(text);}catch(e){raw=null;}
    if(!raw){toast("백업 파일을 읽지 못했어요. 다른 파일인지 확인해 주세요.");return;}

    /* 옛 형식(한 앱짜리)도 그대로 받아 준다 */
    var apps=(raw.apps&&typeof raw.apps==="object")?raw.apps:null;
    if(!apps){ apps={}; apps[KEY]=raw; }

    /* 1) 다른 앱 기록은 저장소에 그대로 합쳐 둔다 — 그 앱을 열면 보인다 */
    var otherAdded=0;
    if(apps[OTHER_KEY]){
      try{
        var cur={done:{},todos:[]};
        var prev=localStorage.getItem(OTHER_KEY);
        if(prev){var pj=JSON.parse(prev); if(pj&&pj.done) cur=pj;}
        var inc2=apps[OTHER_KEY];
        Object.keys(inc2.done||{}).forEach(function(d){
          var box=cur.done[d]||(cur.done[d]={});
          Object.keys(inc2.done[d]).forEach(function(k){
            if(inc2.done[d][k]&&!box[k]){box[k]=true;otherAdded++;}
          });
        });
        var seen={};
        (cur.todos||[]).forEach(function(t){seen[t.id]=1;});
        (inc2.todos||[]).forEach(function(t){
          if(t&&t.id&&!seen[t.id]){cur.todos.push(t);otherAdded++;}
        });
        cur.seed=true; cur.v=DATA_V;
        localStorage.setItem(OTHER_KEY, JSON.stringify(cur));
      }catch(e){}
    }

    /* 2) 이 앱 기록 합치기 */
    var inc=normalize(apps[KEY]);
    var addedDays=0,addedTodos=0;
    if(inc){
      /* 아직 역할을 안 골랐다면 백업에 담긴 역할을 되살린다 */
      if(inc.me&&!okRole(state.me)) setMe(inc.me);
      Object.keys(inc.done).forEach(function(d){
        var src=inc.done[d];
        if(!src||typeof src!=="object") return;
        var box=state.done[d]||(state.done[d]={});
        var before=Object.keys(box).length;
        Object.keys(src).forEach(function(k){if(src[k]) box[k]=true;});
        if(Object.keys(box).length>before) addedDays++;
      });
      if(inc.mcut&&(!state.mcut||inc.mcut<state.mcut)) state.mcut=inc.mcut;
      var have={};
      state.todos.forEach(function(t){have[t.id]=t;});
      inc.todos.forEach(function(t){
        if(!t||!t.id||!t.date) return;
        if(have[t.id]){ if(t.done&&!have[t.id].done) have[t.id].done=true; }
        else{ state.todos.push(t); addedTodos++; }
      });
    }

    state.seed=true;
    save();
    rollover();
    lastStreak=null;
    renderAll();
    lastStreak=streak();

    var msg=(addedDays||addedTodos)
      ? "기록을 합쳤어요 — "+addedDays+"일, 할 일 "+addedTodos+"개 추가"
      : "이 앱에는 새로 들어올 기록이 없었어요.";
    if(otherAdded) msg+=" · 도아 킥 기록도 함께 복구했어요.";
    toast(msg);
  }

  function pickFile(){
    var input=$("importFile");

  $("importFile").addEventListener("change",function(){
    var f=this.files&&this.files[0];

    var r=new FileReader();
    r.onload=function(){importData(String(r.result));};
    r.onerror=function(){toast("파일을 여는 데 실패했어요.");};

  function renderKeep(){
    var days=Object.keys(state.done).filter(function(k){return countDone(k)>0;}).length;
    var openTodos=state.todos.filter(function(t){return !t.done&&!t.del;}).length;

    var status;
    if(!canStore){
      status='<div class="status"><span class="warn">이 브라우저에서는 저장이 막혀 있어요.</span> '+
        '지금 기록은 앱을 닫으면 사라져요. 아래에서 백업 파일로 내보내 두세요.</div>';
    }else{
      status='<div class="status">이 기기에 <b>자동 저장</b> 중'+
        (persisted===true?' · 브라우저가 함부로 지우지 않도록 보호돼 있어요':'')+'.</div>';
    }

    var bak=whenLabel(state.backupAt);
    /* 저장소는 주소 단위로 나뉜다. 주소가 바뀌면 기록이 사라진 것처럼 보이므로
       어느 주소에 저장돼 있는지 늘 보여 준다. */
    var host="";
    try{host=location.hostname+location.pathname.replace(/index\.html$/,"");}catch(e){}
    var stale=!state.backupAt||
      (parse(fmt(new Date()))-parse(fmt(new Date(state.backupAt))))/86400000>14;

    var meta='<div class="meta">'+
      '기록한 날 '+days+'일 · 남은 할 일 '+openTodos+'개'+
      (state.savedAt?' · 마지막 저장 '+whenLabel(state.savedAt):'')+'<br>'+

  /* ---------- 함께 보기 (Firebase 실시간 데이터베이스) ----------
     서버를 사지 않고 여러 사람이 같은 기록을 보게 하는 부분.
     SDK 없이 REST 만 쓴다. 연결이 없으면 조용히 실패하고 앱은 그대로 돈다. */

  var SYNC_KEY=KEY+":sync";
  /* 기본 데이터베이스 주소 — 칸에 미리 채워 둔다.
     다른 곳을 쓰려면 주소를 지우고 새로 붙여넣은 뒤 연결을 누르면 된다. */
  var DEFAULT_DB="https://doa-sem-default-rtdb.asia-southeast1.firebasedatabase.app";
  var sync=null;          /* {db:"https://...firebaseio.com", room:"..."} */
  var syncAt=null, syncing=false, syncErr=false, pushTimer=null, pollTimer=null;

  /* 같은 DB 주소를 쓰는 기기는 모두 같은 자리(family)를 본다 — 방 번호·링크 없이 주소만으로 공유.
     기본은 '켜짐': 홈 화면 앱은 사파리와 저장 공간이 따로라 설정을 물려받지 못하므로,
     처음 여는 순간 기본 DB에 붙어 기록을 받아 온다. 직접 '연결 끊기'를 누른 기기만 꺼져 있다. */
  var SHARED="family";
  function loadSync(){
    var o=null; try{o=JSON.parse(readKey(SYNC_KEY)||"null");}catch(e){}
    if(o&&o.off){sync=null;return;}
    sync={db:(o&&o.db)||DEFAULT_DB};
    /* 예전 방식(방 번호)으로 쓰던 기록은 한 번만 옛 방에서 받아 와 합친다 */
    if(o&&o.room&&!o.moved) sync.legacy=o.room;
    saveSync();
  }
  function saveSync(){
    writeKey(SYNC_KEY,JSON.stringify(sync?{db:sync.db,room:sync.legacy||undefined,moved:!sync.legacy}:{off:true}));
  }
  function syncUrl(room){
    return sync.db.replace(/\/+$/,"")+"/"+encodeURIComponent(room||SHARED)+"/"+encodeURIComponent(KEY)+".json";
  }

  /* --- 합치기 --- */
  function mergeRemote(rem){
    if(!rem||typeof rem!=="object") return false;
    var changed=false;
    var rd=rem.done||{}, rm=rem.dmeta||{};

    /* 고정 미션을 걷어낸 날은 두 기기 중 이른 쪽으로 맞춘다 —
       그래야 같은 날을 두 기기가 다르게 세지 않는다. */
    if(typeof rem.mcut==="string"&&(!state.mcut||rem.mcut<state.mcut)){
      state.mcut=rem.mcut; changed=true;
    }

    /* 과목 목록도 나중에 고친 쪽을 따른다 */
    if(Array.isArray(rem.subjects)&&rem.subjects.length&&(rem.subjAt||0)>(state.subjAt||0)){
      state.subjects=rem.subjects; state.subjAt=rem.subjAt||0;
      if(typeof rem.subjV==="number") state.subjV=rem.subjV;
      changed=true;
    }
    /* 칭찬 스티커 규칙은 나중에 고친 쪽을 따른다 */
    if(rem.sk&&typeof rem.sk==="object"&&(rem.skAt||0)>(state.skAt||0)){
      state.sk=rem.sk; state.skAt=rem.skAt||0; changed=true;
    }

    Object.keys(rd).forEach(function(d){
      var mine=state.dmeta[d]||0, theirs=rm[d]||0;
      if(theirs>mine){
        state.done[d]=rd[d]; state.dmeta[d]=theirs; changed=true;
      }
    });
    /* 상대가 하루를 통째로 지운 경우 */
    Object.keys(rm).forEach(function(d){
      if(rd[d]) return;
      if((rm[d]||0)>(state.dmeta[d]||0)&&state.done[d]){
        delete state.done[d]; state.dmeta[d]=rm[d]; changed=true;
      }
    });

    var byId={};
    state.todos.forEach(function(t){byId[t.id]=t;});
    (rem.todos||[]).forEach(function(t){
      if(!t||!t.id) return;
      var mine=byId[t.id];
      if(!mine){ state.todos.push(t); changed=true; }
      else if(mine.del&&!t.del){}   /* 지운 기록은 무조건 지운 채로 — 다른 폰의 옛 사본이 되살리지 못하게 */
      else if((t.del&&!mine.del)||(t.u||0)>(mine.u||0)){
        for(var k0 in mine) if(!(k0 in t)) delete mine[k0];   /* 통째로 바꾼다 — 한쪽에서 지운 칸이 되살아나지 않게 */
        for(var k in t) mine[k]=t[k];
        changed=true;
      }
    });
    /* 개인 일정 — 지운 것은 지운 채로, 새것이 이기면 통째로 바꾼다 */
    (rem.events||[]).forEach(function(x){
      if(!x||!x.id) return;
      var mine=null; state.events.forEach(function(y){if(y.id===x.id) mine=y;});
      if(!mine){state.events.push(x);changed=true;}
      else if(mine.del&&!x.del){}
      else if((x.del&&!mine.del)||(x.u||0)>(mine.u||0)){for(var k0 in mine) if(!(k0 in x)) delete mine[k0]; for(var k in x) mine[k]=x[k]; changed=true;}
    });
    if(rem.calOpt&&(rem.calAt||0)>(state.calAt||0)){state.calOpt={holi:rem.calOpt.holi!==false};state.calAt=rem.calAt;changed=true;}
    return changed;
  }

  function payload(){ var pl=payloadBody(); lastAt=pl.at; return pl; }
  function payloadBody(){
    return {done:state.done,dmeta:state.dmeta,todos:state.todos,mcut:state.mcut,
            subjects:state.subjects,subjAt:state.subjAt||0,subjV:state.subjV||0,
            sk:state.sk,skAt:state.skAt,events:state.events,calOpt:state.calOpt,calAt:state.calAt||0,at:Date.now()};
  }

  /* 합친 결과를 저장하되, 그 저장이 또 보내기를 부르지 않게 한다 */
  var quietSave=false;
  function saveQuiet(){quietSave=true;try{save();}finally{quietSave=false;}}
  /* 서버에 없는(또는 서버보다 새로운) 기록이 이 기기에 있는지 */
  function remoteBehind(rem){
    if(!rem) return true;
    var m={},rd={}; (rem.todos||[]).forEach(function(t){if(t&&t.id){m[t.id]=t.u||0; if(t.del) rd[t.id]=1;}});
    for(var i=0;i<state.todos.length;i++){var t=state.todos[i]; if(!(t.id in m)||(t.u||0)>m[t.id]||(t.del&&!rd[t.id])) return true;}
    var rm=rem.dmeta||{}, dm=state.dmeta||{};
    for(var d in dm){ if((dm[d]||0)>(rm[d]||0)) return true; }
    if((+state.ruleAt||0)>(+rem.ruleAt||0)) return true;
    if((+state.skAt||0)>(+rem.skAt||0)) return true;
    var re={},rde={}; (rem.events||[]).forEach(function(v){if(v&&v.id){re[v.id]=v.u||0; if(v.del) rde[v.id]=1;}});
    for(var q=0;q<state.events.length;q++){var v=state.events[q]; if(!(v.id in re)||(v.u||0)>re[v.id]||(v.del&&!rde[v.id])) return true;}
    if((+state.calAt||0)>(+rem.calAt||0)) return true;
    return false;
  }
  function afterMerge(changed){
    if(repairMoves()) changed=true;
    if(changed){ saveQuiet(); rollover(); lastStreak=null; renderAll(); lastStreak=streak(); }
    else if(booted) renderKeep();
  }
  function getRemote(room){
    return fetch(syncUrl(room),{cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("bad");
      return r.json();
    });
  }
  /* 옛 방 기록을 한 번 받아 합친다 — 실패해도 조용히 넘어간다 */
  function pullLegacy(){
    if(!sync||!sync.legacy) return Promise.resolve();
    var room=sync.legacy;
    return getRemote(room).then(function(rem){
      if(rem&&mergeRemote(rem)) saveQuiet();
      if(sync){ delete sync.legacy; saveSync(); }
    }).catch(function(){});
  }
  var lastAt=0,liteN=0;   /* 마지막으로 받거나 올린 서버 기록의 시각 */
  function remoteAt(){return fetch(syncUrl().replace(/\.json$/,"/at.json"),{cache:"no-store"}).then(function(r){if(!r.ok) throw 0;return r.json();});}
  function pull(){
    if(!sync) return;
    /* 10번에 한 번(약 5분)은 확인 없이 전체를 받는다 — 혹시 놓친 것이 없게 */
    if(!lastAt||(++liteN%10)===0){pullFull();return;}
    remoteAt().then(function(at){
      if(at&&at===lastAt){syncErr=false;syncAt=Date.now();return;}   /* 바뀐 것 없음 — 전체 기록은 받지 않는다 */
      pullFull();
    }).catch(function(){pullFull();});
  }
  function pullFull(){
    if(!sync) return;
    syncing=true; if(booted) renderKeep();
    pullLegacy().then(function(){ return getRemote(); }).then(function(rem){
      syncErr=false; syncing=false; syncAt=Date.now(); lastAt=(rem&&rem.at)||0;
      afterMerge(rem?mergeRemote(rem):false);
      if(remoteBehind(rem)) schedulePush();   /* 이 기기에만 있는 기록은 올린다 */
    }).catch(function(){
      syncErr=true; syncing=false;
      if(booted) renderKeep();
    });
  }
  /* 보내기 전에 서버 것을 먼저 받아 합친다 — 다른 기기가 방금 넣은 기록을 덮어쓰지 않게 */
  var pushing=false, pushAgain=false;
  function pushNow(){
    if(!sync) return;
    if(pushing){ pushAgain=true; return; }
    pushing=true;
    getRemote().then(function(rem){
      if(rem) afterMerge(mergeRemote(rem));
      return fetch(syncUrl(),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload())});
    }).then(function(r){ syncErr=!r.ok; if(r.ok) syncAt=Date.now(); })
      .catch(function(){ syncErr=true; })
      .then(function(){
        pushing=false; if(booted) renderKeep();
        if(pushAgain){ pushAgain=false; schedulePush(); }
      });
  }
  /* 연달아 체크할 때 매번 보내지 않도록 잠깐 모아서 보낸다 */
  function schedulePush(){
    if(!sync||quietSave) return;
    clearTimeout(pushTimer);
    pushTimer=setTimeout(pushNow,1200);
  }
  function startPolling(){
    clearInterval(pollTimer);
    if(!sync) return;
    pollTimer=setInterval(function(){ if(!document.hidden) pull(); },30000);
  }
  function connectSync(dbUrl){
    dbUrl=(dbUrl||"").trim().replace(/\/+$/,"");
    if(!/^https:\/\/[\w.-]+\.(firebaseio\.com|firebasedatabase\.app)$/.test(dbUrl)){
      return "주소가 올바르지 않아요. https:// 로 시작하는 Firebase 데이터베이스 주소를 넣어 주세요.";
    }
    sync={db:dbUrl}; saveSync();
    pull(); startPolling();
    return null;
  }
  function disconnectSync(){
    sync=null; saveSync(); syncAt=null; syncErr=false;
    clearInterval(pollTimer); clearTimeout(pushTimer);
    renderKeep();
  }

  /* closest() 는 일부 구형 안드로이드 웹뷰에서 SVG 요소에 없다.
     텍스트 노드가 타깃이 되는 경우도 있어 직접 거슬러 올라간다. */
  function up(node,sel){
    var el=node;
    if(el&&el.nodeType!==1) el=el.parentElement;
    while(el){
      if(el.matches?el.matches(sel):(el.msMatchesSelector&&el.msMatchesSelector(sel))) return el;
      el=el.parentElement;
    }
    return null;
  }

    }
    if(up(e.target,"#noInstall")){hide("install");renderInstall();return;}
    if(up(e.target,"#noCarry")){hide("carry");renderCarry();return;}

    if(up(e.target,"#gear")||up(e.target,"#setClose")){
      var box=$("settings"),open=box.hidden;
      box.hidden=!open; $("gear").classList.toggle("on",open); $("gear").setAttribute("aria-expanded",open);
      if(open){renderKeep();try{box.scrollIntoView({block:"start",behavior:"smooth"});}catch(err){}}
      return;
    }
    if(up(e.target,"#kick")){kickBall();return;}
    if((el=up(e.target,"[data-ghost]"))){toast(mmdd(el.getAttribute("data-ghost"))+"로 옮긴 학습이에요. 그날에서 체크하면 여기도 함께 체크돼요.");return;}
    if((el=up(e.target,"[data-todo]"))){
      var tid=el.getAttribute("data-todo");
      var t0=state.todos.filter(function(x){return x.id===tid;})[0];
      var wasComplete=t0?isComplete(t0.date):false;
      toggleTodo(tid);
      var t=state.todos.filter(function(x){return x.id===tid;})[0];
      if(t&&t.done){
        kickBall();
        /* 그 체크로 하루를 다 채웠으면 그날 스티커가 주인공 */
        pop=(isComplete(t.date)&&!wasComplete)?("day:"+t.date):("t:"+tid);
      }
      renderAll(); return;
    }
    if((el=up(e.target,"[data-del]"))){
      var did=el.getAttribute("data-del");
      var dt=findTodo(did);
      /* 반복으로 만든 학습이면 어디까지 지울지 먼저 묻는다 */
      if(dt&&dt.series){delAsk=(delAsk===did)?null:did;renderAll();return;}
      delTodo(did);renderAll();return;
    }
    if((el=up(e.target,"[data-delone]"))){
      delTodo(el.getAttribute("data-delone"));delAsk=null;renderAll();
      toast("이 날짜의 학습만 지웠어요.");return;
    }
    if((el=up(e.target,"[data-delall]"))){
      var dn=delSeries(el.getAttribute("data-delall"));
      delAsk=null;renderAll();
      toast("반복 학습 "+dn+"개를 지웠어요. 이미 해낸 기록은 그대로예요.");return;
    }
    if(up(e.target,"[data-delno]")){delAsk=null;renderAll();return;}
    if((el=up(e.target,"[data-unskip]"))){unskip(el.getAttribute("data-unskip"));renderAll();return;}

    /* 밀린 학습 — 이동 · 스킵 */
    /* 밀린 학습 — 줄마다 체크·옮기기·건너뛰기 */
    if((el=up(e.target,"[data-grow]"))){
      growRange=el.getAttribute("data-grow");
      renderGrowth();return;
    }
    if((el=up(e.target,"[data-blchk]"))){
      var bid=el.getAttribute("data-blchk");
      var bt=findTodo(bid);
      var wasDone=bt?isComplete(bt.date):false;
      toggleTodo(bid);
      var bt2=findTodo(bid);
      if(bt2&&bt2.done){
        kickBall();
        pop=(isComplete(bt2.date)&&!wasDone)?("day:"+bt2.date):("t:"+bid);
      }
      if(mover&&mover.id===bid) mover=null;
      renderAll();
      toast(bt2&&bt2.done?(label(bt2.date)+"의 "+bt2.text+" 체크했어요."):"체크를 풀었어요.");
      return;
    }
    if((el=up(e.target,"[data-blmv]"))){
      var mvid=el.getAttribute("data-blmv");
      mover=(mover&&mover.id===mvid)?null:{id:mvid,to:CUR,err:""};
      renderBacklog();return;
    }
    if((el=up(e.target,"[data-blskip]"))){
      var skid=el.getAttribute("data-blskip");
      var skt=findTodo(skid);
      var ok=skipTodo(skid);
      if(mover&&mover.id===skid) mover=null;
      renderAll();
      toast(ok?((skt?skt.text:"학습")+" 은(는) 건너뛰었어요."):"건너뛸 수 없는 학습이에요.");
      return;
    }
    if(up(e.target,"[data-mv-cancel]")){mover=null;renderBacklog();return;}
    if(up(e.target,"[data-mv-save]")){
      if(!mover) return;
      var box=document.querySelector('[data-mv="to"]');
      var to=box?box.value:mover.to;
      var mt=findTodo(mover.id);
      var r=moveOne(mover.id,to);
      if(r){mover.err=r;mover.to=to;renderBacklog();return;}
      var what=mt?mt.text:"학습";
      mover=null;
      rollover(); renderAll();
      toast(what+" 은(는) "+label(to)+"로 옮겼어요.");
      return;
    }
    if((el=up(e.target,"[data-open]"))){
      /* 달력·밀린 미션에서 고른 날 — 아래 패널이 그날로 바뀐다.
         달력 밖(밀린 미션)에서 왔을 때만 패널로 스크롤한다. */
      selectDay(el.getAttribute("data-open"),!up(e.target,".grid"));
      /* 손가락으로 누른 칸에 초점선이 남지 않게 초점을 놓는다 */
      try{if(el.blur) el.blur();}catch(err){}
      return;
    }
    if((el=up(e.target,"#prev"))&&!el.disabled){
      if(view.m===0){view.y--;view.m=11;}else view.m--;
      renderCal(); return;
    }
    if((el=up(e.target,"#next"))&&!el.disabled){
      if(view.m===11){view.y++;view.m=0;}else view.m++;
      renderCal(); return;
    }
    if((el=up(e.target,"#today"))&&!el.disabled){selectDay(CUR,false);return;}
  });

  /* 작성 폼의 글자·숫자·날짜는 입력할 때마다 상태에만 담는다.
     화면을 다시 그리지 않으므로 키보드가 닫히거나 커서가 튀지 않는다. */
  function bindField(e){
    var evf=up(e.target,"[data-ev]");
    if(evf){evForm[evf.getAttribute("data-ev")]=evf.value;evForm.err="";return true;}
    var kx=up(e.target,"[data-ke]");
    if(kx&&kidEdit){kidEdit.text=kx.value;kidEdit.err="";return true;}
    var kf=up(e.target,"[data-k]");
    if(kf&&kidForm){kidForm.text=kf.value;kidForm.err="";return true;}
    var ee=up(e.target,"[data-e]");
    if(ee&&editor){editor[ee.getAttribute("data-e")]=ee.value;editor.err="";return true;}
    var el=up(e.target,"[data-c]");
    if(!el||!composer) return false;
    var k=el.getAttribute("data-c");
    composer[k]=el.value;
    composer.err="";
    if(k==="from"||k==="to"){
      var hint=up(el,".composer").querySelector(".chint");
      if(hint) hint.textContent=previewCount(composer);
    }
    return true;
  }
  document.addEventListener("input",function(e){
    var el=up(e.target,'[data-mv="to"]');
    if(el&&mover){mover.to=el.value;mover.err="";}
  });
  document.addEventListener("change",function(e){
    var el=up(e.target,'[data-mv="to"]');
    if(el&&mover){mover.to=el.value;mover.err="";}
  });
  document.addEventListener("change",function(e){
    var el=up(e.target,"[data-lr]"); if(!el||!el.value) return;
    if(el.getAttribute("data-lr")==="from") listFrom=el.value; else listTo=el.value;
    renderDay();
  });
  document.addEventListener("keydown",function(e){
    if(e.key!=="Enter") return;
    var b=null;
    if(up(e.target,"#kidIn")) b=document.querySelector("[data-kid-save]");
    else if(up(e.target,"#kidEd")) b=document.querySelector("[data-kedit-save]");
    if(b){e.preventDefault();b.click();}
  });
  document.addEventListener("input",function(e){
    var el=up(e.target,"[data-sm-name],[data-sm-short],#trName,#smNew");
    if(!el) return;
    if(el.id==="trName"){trName=el.value;return;}
    if(el.id==="smNew"){smNew=el.value;return;}
    var id=el.getAttribute("data-sm-name")||el.getAttribute("data-sm-short");
    var g=subjOf(id);
    if(!g) return;
    if(el.hasAttribute("data-sm-name")) g.name=el.value;
    else g.short=el.value;
    touchSubjects();
  });
  document.addEventListener("input",bindField);
  document.addEventListener("change",bindField);

  /* 키보드가 올라올 때 입력창이 가려지지 않게 */
  document.addEventListener("focusin",function(e){
    var input=up(e.target,'.composer input,.composer.edit input');
    if(!input) return;
    setTimeout(function(){
      try{input.scrollIntoView({block:"center",behavior:"smooth"});}catch(err){}
    },280);
  });

  /* 화면 키보드 높이를 CSS 변수로 알려 둔다 */
  if(window.visualViewport){
    var vv=window.visualViewport;
    var applyKb=function(){
      var kb=window.innerHeight-vv.height-vv.offsetTop;
      document.documentElement.style.setProperty("--kb",(kb>60?Math.round(kb):0)+"px");
    };
    vv.addEventListener("resize",applyKb);
    vv.addEventListener("scroll",applyKb);
  }

  /* 폰에서는 앱을 켜둔 채 며칠이 지나기도 한다 — 돌아올 때 날짜를 다시 잡는다 */
  function refreshDay(){
    var t=fmt(new Date());
    if(t===TODAY) return;
    var wasToday=SEL===CUR;   /* 오늘을 보고 있었다면 새 오늘을 따라간다 */
    TODAY=t;
    CUR=TODAY<START?START:(TODAY>END?END:TODAY);
    if(wasToday) SEL=CUR;
    view.y=parse(SEL).getFullYear();view.m=parse(SEL).getMonth();
    rollover();
    lastStreak=null;
    renderAll();
    lastStreak=streak();
  }
  document.addEventListener("visibilitychange",function(){
    if(document.hidden) return;
    refreshDay();
    if(sync) pull();   /* 돌아오면 그동안 상대가 바꾼 걸 받아온다 */
  });
  window.addEventListener("pageshow",refreshDay);

  $("gear").innerHTML=icon("gear");
  $("setClose").innerHTML=icon("close");
  $("prev").innerHTML=icon("left");
  $("next").innerHTML=icon("right");
  /* 기본 과목 판이 올라갔으면 한 번 맞춰 두고 저장한다 */
  (function(){var v0=state.subjV; subjects(); if(state.subjV!==v0) save();})();
  purgeBasic();
  if(repairMoves()) save();
  rollover();
  booted=true;
  checkPersist();
  loadSync();
  if(sync){ pull(); startPolling(); }
  renderAll();
  lastStreak=streak();

  setTimeout(kickBall,420);   /* 앱을 열면 등호가 한 번 찍혀 인사한다 */

  if(restored) toast("기록이 손상돼 있어 직전 안전본으로 되살렸어요.");
})();
</script>
</body>
</html>
